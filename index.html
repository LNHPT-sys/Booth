function sliceBuf(buf,a,b){
  const sr=buf.sampleRate, i0=Math.max(0,Math.round(a*sr)), i1=Math.min(buf.length,Math.round(b*sr)), n=Math.max(1,i1-i0);
  const out=AC().createBuffer(buf.numberOfChannels,n,sr);
  for(let c=0;c<buf.numberOfChannels;c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(i0,i0+n));
  return out;
}
function cutBuf(buf,a,b){
  const sr=buf.sampleRate, i0=Math.round(a*sr), i1=Math.round(b*sr), n=Math.max(1,buf.length-(i1-i0));
  const out=AC().createBuffer(buf.numberOfChannels,n,sr), F=Math.min(Math.round(0.006*sr),i0,buf.length-i1);
  for(let c=0;c<buf.numberOfChannels;c++){
    const src=buf.getChannelData(c), dst=out.getChannelData(c);
    dst.set(src.subarray(0,i0),0); dst.set(src.subarray(i1),i0);
    /* a few milliseconds of crossfade so the join doesn't click */
    for(let k=0;k<F;k++){ const w=(k+1)/(F+1); dst[i0-F+k]=src[i0-F+k]*(1-w)+src[i1-F+k]*w; }
  }
  return out;
}
function commitBuf(t,buf,offset){
  t.buffer=buf; t.blob=new Blob([encodeWAV(buf)],{type:"audio/wav"}); t.mime="audio/wav";
  t.offset=offset; t.fxBuf=null; t.fxKey=""; t.fxPending=""; t.fxBusy=false; t.fxInfo=null;
}
function afterEdit(t){
  UI.edit=null;
  renderAll(); renderFx(t); scheduleSave(); restartSoon();
  if(UI.sheet==="take") requestAnimationFrame(layoutForSheet);
}
function editAct(act,t){
  const E=edSel(t), L=t.buffer.duration;
  if(act==="edtrim"){
    if(E.b-E.a<0.03||E.b-E.a>L-0.02) return;
    pushUndo();
    commitBuf(t,sliceBuf(t.buffer,E.a,E.b),t.offset+E.a);
    afterEdit(t); toast("Kept "+(E.b-E.a).toFixed(1)+" s. Undo brings the rest back.");
  }
  else if(act==="edcut"){
    if(E.b-E.a<0.03||E.b-E.a>L-0.02) return;
    pushUndo();
    if(E.a<0.01) commitBuf(t,sliceBuf(t.buffer,E.b,L),t.offset+E.b);
    else if(E.b>L-0.01) commitBuf(t,sliceBuf(t.buffer,0,E.a),t.offset);
    else commitBuf(t,cutBuf(t.buffer,E.a,E.b),t.offset);
    afterEdit(t); toast("Cut out "+(E.b-E.a).toFixed(1)+" s. Undo puts it back.");
  }
  else if(act==="edsplit"){
    const p=S.playhead-takeStart(t);
    if(!(p>0.05&&p<L-0.05)){ toast("Move the playhead onto this take first, then split."); return; }
    pushUndo();
    const right=Object.assign({},t,{id:++S.seq,name:t.name.slice(0,26)+" 2",fx:{preset:t.fx.preset,amount:t.fx.amount,verb:t.fx.verb,echo:t.fx.echo,tune:Object.assign({},t.fx.tune)},
      abRaw:false,abLatch:false});
    commitBuf(right,sliceBuf(t.buffer,p,L),t.offset+p);
    commitBuf(t,sliceBuf(t.buffer,0,p),t.offset);
    S.takes.splice(S.takes.indexOf(t)+1,0,right);
    afterEdit(t); renderFx(right);
    toast("Split into two takes at "+fmt(S.playhead).slice(0,7)+". Drag either one on its own.");
  }
  else if(act==="edloop"){
    if(E.b-E.a<0.3) return;
    const ts=takeStart(t), d=duration();
    LOOP.a=clamp(ts+E.a,0,d); LOOP.b=clamp(ts+E.b,0,d);
    if(LOOP.b-LOOP.a<0.3) return;
    LOOP.on=true; renderLoop();
    S.playhead=LOOP.a; renderHeads(); play(LOOP.a);
    toast("Looping that part. Tap Loop to turn it off.");
  }
  else if(act==="edrec"){
    if(S.recording) return;
    PUNCH={t:t,at:takeStart(t)+E.a};
    startRec();
  }
}
/* Record over part of a take: the new audio replaces the old from the punch point to wherever you stopped. */
function punchInto(t,nb,ns,P){
  const sr=t.buffer.sampleRate, ts=takeStart(t), te=ts+t.buffer.duration, ne=ns+nb.duration;
  const from=Math.max(P,ns);
  if(ne-from<0.05){ toast("Nothing replaced: you stopped before reaching the left handle."); return; }
  const r0=Math.min(ts,from), r1=Math.max(te,ne);
  const nc=Math.max(t.buffer.numberOfChannels,nb.numberOfChannels), F=Math.round(0.012*sr);
  const o0=Math.round((ts-r0)*sr), n0=Math.round((ns-r0)*sr);
  const n=Math.max(1,Math.round((r1-r0)*sr),o0+t.buffer.length,n0+nb.length);
  const out=AC().createBuffer(nc,n,sr);
  const j0=Math.round((from-ns)*sr), jn=nb.length;
  for(let c=0;c<nc;c++){
    const dst=out.getChannelData(c), oc=t.buffer.getChannelData(Math.min(c,t.buffer.numberOfChannels-1)), nc2=nb.getChannelData(Math.min(c,nb.numberOfChannels-1));
    dst.set(oc,o0);
    for(let j=j0;j<jn;j++){
      const idx=n0+j; if(idx<0||idx>=n) continue;
      const w=Math.min(1,(j-j0+1)/F,(jn-j)/F);
      dst[idx]=dst[idx]*(1-w)+nc2[j]*w;
    }
  }
  pushUndo();
  commitBuf(t,out,r0-t.nudge/1000);
  afterEdit(t);
  toast("Replaced from "+fmt(from).slice(0,7)+" to "+fmt(ne).slice(0,7)+" in "+t.name+". Undo puts the old part back.","good");
}

/* ---- looping a section ---- */
function snapBeat(x){
  const bs=barSeconds(); if(!bs) return x;
  const g=bs/4; return Math.round(x/g)*g;
}
function renderLoop(){
  const d=duration();
  if(LOOP.b>d) LOOP.b=d;
  if(LOOP.on&&LOOP.b-LOOP.a<0.3) LOOP.on=false;
  const btn=$("loopBtn"); btn.setAttribute("aria-pressed",LOOP.on?"true":"false");
  btn.disabled=!(S.beat||S.takes.length);
  const lr=$("lrul"), band=$("loopBand");
  lr.hidden=!LOOP.on; band.hidden=!LOOP.on;
  if(!LOOP.on) return;
  const vis=viewVis(), t0=viewT0();
  const fa=(LOOP.a-t0)/vis, fb=(LOOP.b-t0)/vis;
  const pa=clamp(fa,0,1)*100, pb=clamp(fb,0,1)*100;
  const ba=lr.querySelector(".lband"); ba.style.left=pa+"%"; ba.style.width=Math.max(0,pb-pa)+"%";
  const ha=$("lhA"), hb=$("lhB");
  ha.style.left=(fa*100)+"%"; hb.style.left=(fb*100)+"%";
  ha.style.visibility=(fa<-0.01||fa>1.01)?"hidden":"visible";
  hb.style.visibility=(fb<-0.01||fb>1.01)?"hidden":"visible";
  band.style.left=pa+"%"; band.style.width=Math.max(0,pb-pa)+"%";
}
$("loopBtn").addEventListener("click",()=>{
  if(S.recording) return;
  if(LOOP.on){ LOOP.on=false; renderLoop(); toast("Loop off."); return; }
  const d=duration(), bs=barSeconds(), len=bs?bs*2:6;
  if(!(LOOP.b-LOOP.a>=0.3&&LOOP.b<=d)){
    let a=clamp(snapBeat(S.playhead),0,Math.max(0,d-0.6));
    LOOP.a=a; LOOP.b=Math.min(d,a+len);
    if(LOOP.b-LOOP.a<len&&d>len){ LOOP.b=d; LOOP.a=Math.max(0,d-len); }
  }
  LOOP.on=true; renderLoop();
  toast("Loop on. Drag the gold handles on the ruler to set the part, then play.");
});
let lhDrag=null;
$("lrul").addEventListener("pointerdown",e=>{
  const h=e.target.closest(".lh"); if(!h) return;
  lhDrag={id:e.pointerId,w:h.classList.contains("a")?"a":"b"};
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
$("lrul").addEventListener("pointermove",e=>{
  if(!lhDrag||e.pointerId!==lhDrag.id) return;
  const t=snapBeat(xToTime(e.clientX)), d=duration();
  if(lhDrag.w==="a") LOOP.a=clamp(t,0,LOOP.b-0.3); else LOOP.b=clamp(t,LOOP.a+0.3,d);

});
const lhEnd=e=>{ if(lhDrag&&e.pointerId===lhDrag.id) lhDrag=null; };
$("lrul").addEventListener("pointerup",lhEnd);
$("lrul").addEventListener("pointercancel",lhEnd);

/* ============================ playback ============================ */
/* Nodes of the running playback, kept so sliders change the sound live
   instead of waiting for the next play. */
let liveN={beat:null,takes:new Map()}, playTok=0, restartT=0;
function stopSources(when){
  for(const s of live){ try{ when?s.stop(when):s.stop(); }catch(e){} }
  live=[];
  liveN={beat:null,takes:new Map()};
}
function audible(t){
  const soloOn=S.takes.some(x=>x.solo);
  return !t.mute&&!(soloOn&&!t.solo);
}
/* Solo means "only this": soloing a take silences the beat as well. */
function beatLevel(){ return S.takes.some(x=>x.solo)?0:S.beatVol; }
function liveSet(param,v){
  if(!ctx) return;
  try{ param.cancelScheduledValues(ctx.currentTime); param.setTargetAtTime(v,ctx.currentTime,0.012); }
  catch(e){ param.value=v; }
}
function applyLive(){
  if(!S.playing) return;
  if(liveN.beat) liveSet(liveN.beat.gain,beatLevel());
  for(const t of S.takes){
    const n=liveN.takes.get(t.id); if(!n) continue;
    liveSet(n.gain.gain,audible(t)?t.gain:0);
    if(n.pan) liveSet(n.pan.pan,clamp(t.pan,-1,1));
    if(n.gRaw){ liveSet(n.gRaw.gain,t.abRaw?1:0); liveSet(n.gFx.gain,t.abRaw?0:1); }
  }
}
function nowPos(){
  return (ctx&&S.playing)?Math.max(p0,p0+(ctx.currentTime-t0)):S.playhead;
}
/* Sync moves a take in time, which means rescheduling it: restart from
   where we are once the finger settles. */
function restartSoon(){
  if(!S.playing||S.recording) return;
  clearTimeout(restartT);
  restartT=setTimeout(()=>{ if(S.playing&&!S.recording) play(nowPos()); },140);
}
function tick(){
  if(!ctx) return;
  const pos=p0+(ctx.currentTime-t0);
  /* looping a section: line the next pass up with the end of this one so it doesn't stutter */
  if(LOOP.on&&S.playing&&!S.recording&&!loopBusy&&pos>=LOOP.b-0.12&&pos<LOOP.b+0.4){
    loopBusy=true;
    play(LOOP.a,{at:t0+(LOOP.b-p0)}).then(()=>{ loopBusy=false; },()=>{ loopBusy=false; });
  }
  const d=duration();
  if(pos>=d){
    stopSources();
    if(S.loop&&!S.recording){ play(0); return; }
    S.playing=false; S.playhead=S.recording?pos:0;
    if(!S.recording){ renderHeads(); renderMix(); setPlayIcon(); return; }
  }
  S.playhead=Math.min(pos,S.recording?pos:d);
  if(!V.fit) followView();
  renderHeads();
  raf=requestAnimationFrame(tick);
}

function playHere(){
  if(LOOP.on&&!(S.playhead>=LOOP.a&&S.playhead<LOOP.b-0.05)){ S.playhead=LOOP.a; renderHeads(); }
  play(S.playhead);
}
async function play(from,opt){
  const c=AC();
  const my=++playTok;
  try{ await c.resume(); }catch(e){}
  if(my!==playTok) return;            /* a newer play() already took over */
  const seam=!!(opt&&opt.at!=null);
  const lead=0.09, at=seam?Math.max(opt.at,c.currentTime+0.005):c.currentTime+lead;
  stopSources(seam?at:0);
  t0=at; p0=from;
  const dest=c.destination;

  if(S.beat&&from<S.beat.buffer.duration){
    const s=c.createBufferSource(); s.buffer=S.beat.buffer;
    const g=c.createGain(); g.gain.value=beatLevel();
    s.connect(g); g.connect(dest);
    s.start(at,Math.max(0,from)); live.push(s);
    liveN.beat=g;
  }
  for(const t of S.takes){
    /* muted takes still get wired, at zero, so Mute and Solo work mid-play */
    const g=c.createGain(); g.gain.value=audible(t)?t.gain:0;
    let pan=null;
    if(c.createStereoPanner){ pan=c.createStereoPanner(); pan.pan.value=clamp(t.pan,-1,1); }
    const head=pan||g;
    if(pan) pan.connect(g);
    g.connect(dest);
    /* raw and processed both run; A/B just crossfades between them */
    t.abRaw=!!(t.abLatch||(abHeld&&abHeld.t===t));
    const srcs=[], fxb=(fxActive(t)&&t.fxBuf)?t.fxBuf:null;
    const s=c.createBufferSource(); s.buffer=t.buffer; srcs.push(s);
    let gRaw=null,gFx=null;
    if(fxb){
      gRaw=c.createGain(); gFx=c.createGain();
      gRaw.gain.value=t.abRaw?1:0; gFx.gain.value=t.abRaw?0:1;
      s.connect(gRaw); gRaw.connect(head);
      const s2=c.createBufferSource(); s2.buffer=fxb; s2.connect(gFx); gFx.connect(head); srcs.push(s2);
    } else s.connect(head);
    liveN.takes.set(t.id,{gain:g,pan:pan,gRaw:gRaw,gFx:gFx});
    const clip=t.offset+t.nudge/1000;
    const when=at+(clip-from);
    if(when>=at){ for(const x of srcs) x.start(when,0); }
    else{
      const into=from-clip;
      if(into>=t.buffer.duration) continue;
      for(const x of srcs) x.start(at,into);
    }
    /* punching in: the old take plays up to the punch point and then goes quiet */
    if(S.recording&&PUNCH&&PUNCH.t===t){ const stopAt=at+Math.max(0,PUNCH.at-from); for(const x of srcs){ try{ x.stop(stopAt); }catch(e){} } }
    for(const x of srcs) live.push(x);
  }
  S.playing=true; setPlayIcon();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function pause(){
  playTok++; stopSources(); cancelAnimationFrame(raf);
  S.playing=false; setPlayIcon();
}
function stopAll(){
  playTok++; stopSources(); cancelAnimationFrame(raf);
  S.playing=false; S.playhead=0; setPlayIcon(); renderHeads();
}
function setPlayIcon(){
  const b=$("playBtn");
  b.innerHTML=ic(S.playing?"pause":"play");
  b.setAttribute("aria-label",S.playing?"Pause":"Play");
}

/* ============================ metering ============================ */
/* The transport bar grows while recording; everything that sits above
   it (toasts, page padding) reads its height from --barh. */
function syncBarH(){
  const b=$("dock");
  if(b) document.documentElement.style.setProperty("--dockh",b.offsetHeight+"px");
}

/* Live take: while recording, the bar shows the beat faintly and draws the
   incoming vocal on top of it in real time, on the same timeline the take
   will land on. */
const REC={peaks:[],from:0,span:1,beatImg:null,clipT:0,loudT:0};
function recSpan(){ return Math.max(duration(),S.playhead+4); }
function recLaneStart(){
  REC.peaks=[]; REC.from=recFrom-S.latency/1000; REC.span=recSpan(); REC.beatImg=null;
  document.body.classList.add("recording");
  renderTracks(); syncBarH();
  const live=document.querySelector("#trackList .row.live");
  if(live){ const stage=$("stage"), r=live.getBoundingClientRect(), sr=stage.getBoundingClientRect(); if(r.bottom>sr.bottom-10) stage.scrollTop+=r.bottom-sr.bottom+20; }
}
function recLaneEnd(){
  document.body.classList.remove("recording");
  $("recMeter").hidden=true; syncBarH();
}
function drawRecLane(){
  const cv=$("liveCv"); if(!cv) return;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  if(V.fit&&S.playhead+1>REC.span){ REC.span=recSpan()*1.25; layoutTimeline(); return; }
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.floor(w*dpr)){ cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr); }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const vis=viewVis(), t0=viewT0();
  const bw=2, gap=1.2, cols=Math.floor(w/(bw+gap)), mid=h/2, a=new Float32Array(cols);
  for(const p of REC.peaks){
    const x=Math.floor(((REC.from+p[0]-t0)/vis)*cols);
    if(x>=0&&x<cols&&p[1]>a[x]) a[x]=p[1];
  }
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,"#FFC2B0"); gr.addColorStop(0.5,"#FF6A47"); gr.addColorStop(1,"#FFC2B0");
  g.fillStyle=gr;
  for(let i=0;i<cols;i++){
    if(!a[i]) continue;
    const hh=Math.max(1.5,Math.min(1,a[i]*1.7)*mid*0.9), x=i*(bw+gap);
    if(g.roundRect){ g.beginPath(); g.roundRect(x,mid-hh,bw,hh*2,1); g.fill(); } else g.fillRect(x,mid-hh,bw,hh*2);
  }
}

function meterTick(){
  if(!analyser) return;
  const b=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(b);
  let s=0, pk=0;
  for(let i=0;i<b.length;i++){ const v=(b[i]-128)/128; s+=v*v; const a=Math.abs(v); if(a>pk) pk=a; }
  const rms=Math.sqrt(s/b.length), lvl=clamp(rms*2.3,0,1);
  const col = lvl>0.88?"#FF5A47":lvl>0.62?"#F5BE55":"#62D9A0";
  const rf=$("recMeterFill");
  rf.style.width=(lvl*100)+"%"; rf.style.background=col;
  /* plain-language level hint: clipping wins, then too quiet */
  const now=performance.now();
  if(pk>0.98) REC.clipT=now;
  if(lvl>=0.04) REC.loudT=now;
  const hint=$("recHint");
  if(now-REC.clipT<1200){ hint.textContent="Too loud"; hint.className="hint bad"; }
  else if(now-REC.loudT>1500){ hint.textContent="Too quiet"; hint.className="hint warn"; }
  else { hint.textContent="Good level"; hint.className="hint"; }
  if(S.recording){
    REC.peaks.push([S.playhead-recFrom,pk]);
    drawRecLane();
  }
  mraf=requestAnimationFrame(meterTick);
}
function stopMeter(){
  cancelAnimationFrame(mraf);
  $("recMeterFill").style.width="0%";
}

/* ============================ recording ============================ */
function countIn(c){
  return new Promise(res=>{
    const ov=document.createElement("div");
    ov.className="over";
    ov.innerHTML='<div class="lab">Get ready</div><div class="big">4</div><div class="msg">headphones on</div>';
    document.body.appendChild(ov);
    const big=ov.querySelector(".big");
    let n=4;
    const beep=last=>{
      const o=c.createOscillator(), g=c.createGain();
      o.frequency.value=last?1050:690; o.type="square";
      o.connect(g); g.connect(c.destination);
      const t=c.currentTime;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.26,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
      o.start(t); o.stop(t+0.16);
    };
    beep(false); n--;
    const iv=setInterval(()=>{
      if(n<=0){ clearInterval(iv); ov.remove(); res(); return; }
      big.textContent=n; beep(n===1); n--;
    },520);
  });
}

async function getMic(){
  if(stream) return stream;
  stream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}
  });
  return stream;
}

async function startRec(){
  closeSheet();
  const c=AC();
  try{ await c.resume(); }catch(e){}
  let st;
  try{ st=await getMic(); }
  catch(e){
    ENV.micErr=(e&&(e.name||e.message))||"failed";
    ENV.perm="denied"; PUNCH=null;
    renderCheck();
    toast(ENV.policy===false
      ? "This window can't reach the microphone. Open BOOTH in its own window to record."
      : "Microphone refused: "+ENV.micErr, "bad");
    return;
  }
  ENV.perm="granted"; ENV.micErr=""; renderCheck();

  micSrc=c.createMediaStreamSource(st);
  analyser=c.createAnalyser(); analyser.fftSize=512;
  micSrc.connect(analyser);
  if(S.monitor){
    monGain=c.createGain(); monGain.gain.value=0.8;
    micSrc.connect(monGain); monGain.connect(c.destination);
  }
  $("recMeter").hidden=false; syncBarH();
  cancelAnimationFrame(mraf); mraf=requestAnimationFrame(meterTick);

  if(S.countIn) await countIn(c);

  recMime=ENV.mime;
  /* Browsers default to a low, voice-call bitrate; ask for a music one. */
  const ro={audioBitsPerSecond:256000};
  if(recMime) ro.mimeType=recMime;
  try{ recorder=new MediaRecorder(st,ro); }
  catch(e){
    try{ recorder=new MediaRecorder(st); recMime=recorder.mimeType||""; }
    catch(e2){ PUNCH=null; stopMeter(); recLaneEnd(); toast("This browser can't record audio.","bad"); return; }
  }
  chunks=[];
  recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  recorder.onstop=finishRec;
  if(PUNCH) S.playhead=Math.max(0,PUNCH.at-PRE);
  recFrom=S.playhead;
  recorder.start();
  S.recording=true; renderUndo(); buzz(18);
  recLaneStart();
  $("recBtn").classList.add("on");
  $("recBtn").setAttribute("aria-label","Stop recording");
  renderMix();
  play(recFrom);
  if(PUNCH) toast("Replacing from "+fmt(PUNCH.at).slice(0,7)+" in "+PUNCH.t.name+". You get "+PRE+" s of lead-in; tap stop when you're done.");
}

function stopRec(){
  try{ recorder&&recorder.state!=="inactive"&&recorder.stop(); }catch(e){}
  stopSources(); cancelAnimationFrame(raf);
  S.playing=false; setPlayIcon();
}

async function finishRec(){
  const pun=PUNCH; PUNCH=null;
  S.recording=false; renderUndo(); buzz([12,40,12]);
  $("recBtn").classList.remove("on");
  $("recBtn").setAttribute("aria-label","Record");
  stopMeter(); recLaneEnd();
  if(monGain){ try{ monGain.disconnect(); }catch(e){} monGain=null; }
  const blob=new Blob(chunks,{type:recMime||"audio/webm"});
  chunks=[];
  if(!blob.size){ toast("That take came back empty — nothing was captured.","bad"); return; }
  try{
    const buf=await decode(await blob.arrayBuffer());
    /* no clamp at zero: recording from the top is the normal case, and
       clamping there threw the whole latency correction away */
    if(pun&&S.takes.includes(pun.t)){
      punchInto(pun.t,buf,recFrom-S.latency/1000,pun.at);
    } else {
      addTake(buf,blob,recMime,recFrom-S.latency/1000,"Take "+(S.takes.length+1),true);
      const nt=S.takes[S.takes.length-1];
      toast("Take "+S.takes.length+" captured — "+fmt(buf.duration).slice(0,5)+
        (nt&&fxActive(nt)?". "+FX_LABEL[nt.fx.preset]+" is on and rendering; hold the raw button to compare. ":". ")+
        "Off the beat? Slide SYNC or drag it.","good");
    }
  }catch(e){
    toast("Couldn't read that take back: "+(e.message||e),"bad");
  }
  S.playhead=0; renderAll(); renderHeads();
}

function addTake(buffer,blob,mime,offset,name,recorded){
  pushUndo();
  S.takes.push({
    id:++S.seq,name:name,buffer:buffer,blob:blob,mime:mime||"",
    offset:offset||0,nudge:0,gain:1,pan:0,mute:false,solo:false,
    recorded:!!recorded,
    fx:{preset:"off",amount:0.6,verb:0,echo:0,tune:{mode:"off",root:0,scale:"major"}},fxBuf:null,fxKey:"",fxPending:"",fxBusy:false,abRaw:false,abLatch:false
  });
  const t=S.takes[S.takes.length-1];
  /* only takes recorded here; imported files are left exactly as they came */
  if(recorded&&AUTO.on&&FX_LABEL[AUTO.preset]){
    t.fx={preset:AUTO.preset,amount:1,verb:SPACE_DEFAULT[AUTO.preset][0],echo:SPACE_DEFAULT[AUTO.preset][1],tune:{mode:"off",root:0,scale:"major"}};
    renderFx(t);
  }
  renderAll(); scheduleSave();
}

/* ============================ export ============================ */
/* A latency-corrected take can start before 0:00 — skip its head instead
   of pushing the whole take late. */
function startClip(s,t){
  const at=t.offset+t.nudge/1000;
  if(at>=0) s.start(at,0);
  else if(-at<t.buffer.duration) s.start(0,-at);
}
async function renderMixBuffer(withTakesOnly){
  const c=AC(), sr=c.sampleRate, total=duration();
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const off=new OAC(2,Math.max(1,Math.ceil(total*sr)),sr);
  const dest=off.destination;
  if(S.beat&&!withTakesOnly){
    const s=off.createBufferSource(); s.buffer=S.beat.buffer;
    const g=off.createGain(); g.gain.value=S.beatVol;
    s.connect(g); g.connect(dest); s.start(0,0);
  }
  for(const t of S.takes){
    if(t.mute) continue;          /* solo is for listening; the export is the whole song */
    const s=off.createBufferSource(); s.buffer=fxBufOf(t);
    const g=off.createGain(); g.gain.value=t.gain;
    let node=s;
    let pan=null;
    if(off.createStereoPanner){ pan=off.createStereoPanner(); pan.pan.value=clamp(t.pan,-1,1); }
    if(pan){ node.connect(pan); pan.connect(g); } else { node.connect(g); }
    g.connect(dest);
    startClip(s,t);
  }
  return await off.startRendering();
}

async function renderStem(t){
  const c=AC(), sr=c.sampleRate, total=duration();
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const off=new OAC(2,Math.max(1,Math.ceil(total*sr)),sr);
  const s=off.createBufferSource(); s.buffer=fxBufOf(t);
  const g=off.createGain(); g.gain.value=t.gain;
  let node=s;
  let pan=null;
  if(off.createStereoPanner){ pan=off.createStereoPanner(); pan.pan.value=clamp(t.pan,-1,1); }
  if(pan){ node.connect(pan); pan.connect(g); } else { node.connect(g); }
  g.connect(off.destination);
  startClip(s,t);
  return await off.startRendering();
}

function safeName(s){
  return String(s||"booth").replace(/\.[^.]+$/,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,40)||"booth";
}

async function doExport(){
  if(!fxAllReady()){ toast("Still rendering a take's sound — try again in a moment."); return; }
  const btn=$("exportBtn"), old=btn.textContent;
  btn.disabled=true; btn.textContent="Rendering…";
  try{
    const base=safeName(S.beat?S.beat.name:"booth");
    const files=[];
    const mix=await renderMixBuffer(false);
    clipGuard(mix);
    files.push({name:base+"_mix.wav",data:encodeWAV(mix)});
    if(S.stems){
      if(S.beat) files.push({name:"stems/beat.wav",data:encodeWAV(S.beat.buffer)});
      for(let i=0;i<S.takes.length;i++){
        const t=S.takes[i];
        btn.textContent="Rendering stem "+(i+1)+"/"+S.takes.length+"…";
        const b=await renderStem(t);
        files.push({name:"stems/"+String(i+1).padStart(2,"0")+"_"+safeName(t.name)+".wav",data:encodeWAV(b)});
      }
    }
    const notes=
      "BOOTH session\n"+
      "beat: "+(S.beat?S.beat.name:"(none)")+"\n"+
      "length: "+fmt(duration())+"\n"+
      "takes: "+S.takes.length+"\n"+
      "\n"+
      S.takes.map((t,i)=>(i+1)+". "+t.name+" — start "+fmt(t.offset)+", sync "+(t.nudge>0?"+":"")+t.nudge+
        "ms, level "+Math.round(t.gain*100)+", pan "+(t.pan===0?"C":(t.pan<0?"L":"R")+Math.round(Math.abs(t.pan)*100))+
        (t.mute?", muted":"")).join("\n")+"\n";
    files.push({name:"session.txt",data:new TextEncoder().encode(notes)});

    btn.textContent="Packing…";
    const zip=zipStore(files);
    const fname=base+"_booth.zip";

    if(window.__dl&&window.__dl.save){
      try{
        await window.__dl.save({filename:fname,data:zip});
        toast("Saved "+fname+" — unzip it for mix.wav"+(S.stems?" and the stems":"")+".","good");
      }catch(err){
        const code=err&&err.code;
        if(code==="declined") toast("Export cancelled.");
        else if(code==="too_large") toast("That mix is too big for this window. Turn stems off and try again.","bad");
        else { blobDownload(zip,fname); }
      }
    } else {
      blobDownload(zip,fname);
    }
  }catch(e){
    toast("Export failed: "+(e.message||e),"bad");
  }
  btn.textContent=old; btn.disabled=false;
}

function blobDownload(blob,name){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    toast("Saved "+name+" — open it in Files and unzip for your WAVs.","good");
  }catch(e){
    toast("The browser blocked that download. Allow downloads for this site and export again.","bad");
  }
}

/* ============================ file loading ============================ */
async function loadBeatFile(file){
  try{
    const blob=file.slice(0,file.size,file.type||"audio/mpeg");
    const buf=await decode(await file.arrayBuffer());
    pushUndo();
    resetView();
    S.beat={name:file.name,buffer:buf,blob:blob,bpm:detectBPM(envelope(buf))};
    detectBeatKey(S.beat);
    S.takes.forEach(renderFx);
    S.playhead=0; stopAll(); renderAll(); scheduleSave();
    toast("Beat loaded — "+fmt(buf.duration).slice(0,5)+".","good");
  }catch(e){
    toast("Couldn't read that beat. Try an mp3, wav or m4a export.","bad");
  }
}
async function loadTakeFiles(files){
  let n=0;
  for(const f of files){
    try{
      const blob=f.slice(0,f.size,f.type||"audio/mpeg");
      const buf=await decode(await f.arrayBuffer());
      addTake(buf,blob,f.type||"",0,safeName(f.name).replace(/_/g," ").slice(0,24)||"Import "+(S.takes.length+1));
      n++;
    }catch(e){}
  }
  if(n) toast(n+(n===1?" take imported":" takes imported")+" at 00:00 — drag "+(n===1?"it":"them")+" into place.","good");
  else toast("Couldn't read that file as audio.","bad");
}

/* ---- take editor ---- */
$("takeBody").addEventListener("click",e=>{
  const row=e.target.closest(".take"); if(!row) return;
  const t=takeById(row.dataset.id); if(!t) return;
  const btn=e.target.closest("[data-act]");
  if(!btn||btn.tagName==="INPUT"||btn.tagName==="SELECT") return;
  const act=btn.dataset.act;
  if(act==="ab") return;                      /* handled on pointer events */
  if(act==="close"){ closeSheet(); return; }
  if(act==="tab"){ UI.tab=btn.dataset.tab; renderSheetBody(); requestAnimationFrame(layoutForSheet); return; }
  if(act==="fxpre"){
    const p=btn.dataset.preset;
    if(!FX_LABEL[p]||p===t.fx.preset) return;
    pushUndo(); t.fx.preset=p; t.abRaw=false; t.abLatch=false;
    t.fx.amount=1;                      /* full strength is where it sounds best; turn it down if you like */
    t.fx.verb=SPACE_DEFAULT[p][0]; t.fx.echo=SPACE_DEFAULT[p][1];
    renderAll(); renderFx(t); scheduleSave(); restartSoon(); requestAnimationFrame(layoutForSheet);
    return;
  }
  if(act==="tunemode"){
    const m=btn.dataset.mode;
    if(!TUNE_LABEL[m]||m===t.fx.tune.mode) return;
    pushUndo(); t.abRaw=false; t.abLatch=false;
    if(t.fx.tune.mode==="off"&&S.beat&&S.beat.key){   /* first time on: start in the beat's key */
      t.fx.tune.root=keyMajorRoot(S.beat.key); t.fx.tune.scale="major";
    }
    t.fx.tune.mode=m;
    renderAll(); renderFx(t); scheduleSave(); restartSoon(); requestAnimationFrame(layoutForSheet);
    return;
  }
  if(act==="tunescale"){
    const c=btn.dataset.scale;
    if(!SCALE_LABEL[c]||c===t.fx.tune.scale) return;
    pushUndo(); t.fx.tune.scale=c;
    renderAll(); renderFx(t); scheduleSave(); restartSoon();
    return;
  }
  if(act==="tunebeat"){
    if(!(S.beat&&S.beat.key)) return;
    pushUndo(); t.fx.tune.root=keyMajorRoot(S.beat.key); t.fx.tune.scale="major";
    renderAll(); renderFx(t); scheduleSave(); restartSoon();
    toast("Tuning to "+keyLabel(S.beat.key)+". They use the same notes.");
    return;
  }
  if(act==="edtrim"||act==="edcut"||act==="edsplit"||act==="edloop"||act==="edrec"){ editAct(act,t); return; }
  if(act==="mute"){ pushUndo(); t.mute=!t.mute; renderAll(); applyLive(); scheduleSave(); }
  else if(act==="solo"){
    pushUndo(); t.solo=!t.solo; renderAll(); applyLive(); scheduleSave();
    if(t.solo) toast("Solo: you'll hear only "+t.name+". The beat and other takes go quiet. Tap Solo again to hear everything.");
  }
  else if(act==="setdelay"){
    if(!t.nudge){ toast("Slide Timing until this take sits right, then lock it in."); return; }
    pushUndo();
    S.latency=clamp(Math.round(S.latency-t.nudge),-1500,1500);
    saveLatency();
    /* this take is already where it should be: fold the nudge into its start */
    t.offset=t.offset+t.nudge/1000; t.nudge=0;
    renderAll(); scheduleSave();
    toast("Locked in. BOOTH now shifts every new take by "+S.latency+" ms, so you only do this once per setup.","good");
  }
  else if(act==="barback"||act==="barfwd"){
    const bs=barSeconds();
    if(!bs){ toast("Couldn't read this beat's tempo, so bar moves are off. Use Timing instead.","bad"); return; }
    pushUndo();
    t.offset=Math.max(0,t.offset+(act==="barfwd"?bs:-bs));
    renderAll(); scheduleSave(); restartSoon();
    toast(t.name+" moved "+(act==="barfwd"?"forward":"back")+" one bar, now starting at "+fmt(t.offset)+".");
  }
  else if(act==="del"){
    pushUndo();
    S.takes=S.takes.filter(x=>x.id!==t.id);
    closeSheet(); renderAll(); scheduleSave(); restartSoon();
    toast("Deleted "+t.name+". Undo brings it back.");
  }
});
$("takeBody").addEventListener("change",e=>{
  const inp=e.target.closest("[data-act]"); if(inp) delete inp.dataset.armed;
  /* sound sliders render on release, not on every tick */
  const fx=e.target.closest('[data-act="fxamt"],[data-act="fxverb"],[data-act="fxecho"],[data-act="tunekey"]'); if(!fx) return;
  const row=e.target.closest(".take"); if(!row) return;
  const t=takeById(row.dataset.id); if(t) renderFx(t);
});
$("takeBody").addEventListener("input",e=>{
  const inp=e.target.closest("[data-act]"); if(!inp) return;
  const row=e.target.closest(".take"); if(!row) return;
  const t=takeById(row.dataset.id); if(!t) return;
  const act=inp.dataset.act, v=inp.value;
  const vEl=inp.parentElement?inp.parentElement.querySelector(".v"):null;
  if(act!=="name"&&!inp.dataset.armed){ pushUndo(); inp.dataset.armed="1"; }
  if(act==="gain"){ t.gain=parseFloat(v); if(vEl) vEl.textContent=fmtVol(t.gain); applyLive(); }
  else if(act==="pan"){ t.pan=parseFloat(v); if(vEl) vEl.textContent=fmtPan(t.pan); applyLive(); }
  else if(act==="nudge"){
    t.nudge=parseInt(v,10);
    if(vEl) vEl.textContent=fmtNudge(t.nudge);
    const r=document.querySelector('#trackList .row[data-id="'+t.id+'"]');
    if(r) placeClip(r,t);
    restartSoon();
  }
  else if(act==="fxamt"||act==="fxverb"||act==="fxecho"){
    const key=act==="fxamt"?"amount":act==="fxverb"?"verb":"echo";
    t.fx[key]=parseFloat(v);
    if(vEl) vEl.textContent=Math.round(t.fx[key]*100)+"%";
  }
  else if(act==="tunekey"){ t.fx.tune.root=parseInt(v,10)%12; }
  else if(act==="name"){
    t.name=inp.value.slice(0,30);
    const lb=document.querySelector('#trackList .row[data-id="'+t.id+'"] .nm'); if(lb) lb.textContent=t.name;
  }
  scheduleSave();
});
/* A/B: hold to hear the raw take and release for the sound again, or tap
   once to stay on raw, and tap again to come back. */
let abHeld=null;
function abLabel(t,btn){
  btn.classList.toggle("on",t.abRaw);
  btn.textContent=t.abLatch?"Hearing raw · tap to switch back":(t.abRaw?"Raw":"Tap or hold: hear raw");
}
function abEnd(){
  if(!abHeld) return;
  const {t,btn,t0}=abHeld; abHeld=null;
  if(performance.now()-t0<320){ t.abLatch=true; abLabel(t,btn); return; }   /* a tap: stay on raw */
  t.abRaw=false; t.abLatch=false; abLabel(t,btn);
  applyLive();
}
$("takeBody").addEventListener("pointerdown",e=>{
  const btn=e.target.closest('[data-act="ab"]'); if(!btn) return;
  const row=btn.closest(".take"); if(!row) return;
  const t=takeById(row.dataset.id); if(!t) return;
  e.preventDefault();
  if(t.abLatch){ t.abLatch=false; t.abRaw=false; abLabel(t,btn); applyLive(); return; }
  abEnd();
  abHeld={t:t,btn:btn,t0:performance.now()};
  t.abRaw=true; abLabel(t,btn); buzz(8);
  try{ btn.setPointerCapture(e.pointerId); }catch(err){}
  if(!S.playing&&!S.recording) play(S.playhead); else applyLive();
});
$("takeBody").addEventListener("contextmenu",e=>{ if(e.target.closest('[data-act="ab"]')) e.preventDefault(); });
document.addEventListener("pointerup",abEnd);
document.addEventListener("pointercancel",abEnd);

/* ---- settings + export ---- */
$("tgAuto").addEventListener("click",()=>{
  AUTO.on=!AUTO.on; saveAuto(); renderAuto();
  toast(AUTO.on
    ? "New recordings will start with "+FX_LABEL[AUTO.preset]+". Takes you already have are unchanged."
    : "New recordings will come in raw.");
});
document.querySelectorAll("[data-auto]").forEach(b=>b.addEventListener("click",()=>{
  AUTO.preset=b.dataset.auto; saveAuto(); renderAuto();
}));
function bindTog(id,key,after){
  $(id).addEventListener("click",()=>{
    S[key]=!S[key]; setTog(id,S[key]);
    if(after) after();
    renderMix(); scheduleSave();
  });
}
bindTog("tgMonitor","monitor");
bindTog("tgCount","countIn");
bindTog("tgLoop","loop");
bindTog("tgStems","stems");
$("exportBtn").addEventListener("click",doExport);
$("recheck").addEventListener("click",async()=>{
  probeSync(); await probeAsync(); renderCheck();
  toast("Microphone check re-run.");
});

/* ---- transport ---- */
$("stopBtn").addEventListener("click",()=>{ if(S.recording) stopRec(); else stopAll(); });
$("playBtn").addEventListener("click",()=>{ if(S.recording) return; S.playing?pause():playHere(); });
$("recBtn").addEventListener("click",()=>{ S.recording?stopRec():startRec(); });

/* ---- the timeline: tap a take to edit it; drag a lane or the ruler to scrub;
   press and hold a take, then drag, to move it. Vertical swipes scroll. ---- */
let ptr=null, pinch=null, edgeT=0;
const pts=new Map();
const HOLD_MS=380;
function placeClip(row,t){
  const clip=row&&row.querySelector(".clip"); if(!clip) return;
  const i=S.takes.indexOf(t); clip._d=clipGeom(t,i<0?0:i);
  layoutClip(clip,$("ruler").clientWidth,viewVis(),viewT0());
}
function xToTime(x){
  const r=$("ruler").getBoundingClientRect();
  return viewT0()+clamp((x-r.left)/Math.max(1,r.width),0,1)*viewVis();
}
function scrubSeek(x){ S.playhead=clamp(xToTime(x),0,tlDur()); renderHeads(); }
function startMove(){
  const p=ptr; if(!p||p.mode||pinch) return;
  p.mode="move"; buzz(16);
  p.clip.classList.add("grab","mv");
  p.off0=p.t.offset; p.d=tlDur(); p.vis=viewVis();
  p.w=Math.max(1,$("ruler").getBoundingClientRect().width);
  p.clip.dataset.t=fmt(Math.max(0,p.t.offset+p.t.nudge/1000));
  try{ p.row.querySelector(".lane").setPointerCapture(p.id); }catch(err){}
}
/* while a finger rests near an edge of a zoomed timeline, the view slides that way */
function edgeTick(){
  const p=ptr;
  if(!p||p.mode!=="scrub"||V.fit){ edgeT=0; return; }
  const r=$("ruler").getBoundingClientRect(), x=p.lastX;
  let v=0;
  if(x<r.left+30) v=-(1-(x-r.left)/30); else if(x>r.right-30) v=1-(r.right-x)/30;
  v=clamp(v,-1,1);
  if(v){ const vis=viewVis(); setView(vis,viewT0()+v*vis*0.018); scrubSeek(x); layoutTimeline(); }
  edgeT=requestAnimationFrame(edgeTick);
}
function abortPtr(){
  const p=ptr; if(!p) return;
  clearTimeout(p.timer);
  if(p.mode==="move"){ p.clip.classList.remove("grab","mv"); if(p.moved){ renderAll(); scheduleSave(); restartSoon(); } }
  else if(p.mode==="scrub"&&p.resume) play(S.playhead);
  ptr=null;
}
function startPinch(){
  const [a,b]=[...pts.values()], r=$("ruler").getBoundingClientRect();
  const vis=viewVis(), t0=viewT0(), frac=clamp(((a.x+b.x)/2-r.left)/r.width,0,1);
  pinch={d0:Math.max(8,Math.hypot(a.x-b.x,a.y-b.y)),vis0:vis,at:t0+vis*frac};
  if(S.playing){ stopSources(); cancelAnimationFrame(raf); S.playing=false; setPlayIcon(); pinch.resume=true; }
}
function endPinch(){
  if(pinch&&pinch.resume) play(S.playhead);
  pinch=null;
}
document.addEventListener("pointerdown",e=>{
  if(S.recording||(e.pointerType==="mouse"&&e.button!==0)) return;
  const hit=e.target.closest("#trackList .lane, #trackList .lbl, #ruler"); if(!hit) return;
  if(hit.id==="ruler"||hit.classList.contains("lane")){
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ abortPtr(); startPinch(); return; }
    if(pts.size>2) return;
  }
  const row=hit.closest(".row"), kind=hit.id==="ruler"?"ruler":(hit.classList.contains("lbl")?"lbl":"lane");
  const rowId=row?row.dataset.id:null;
  const t=(row&&rowId!=="beat"&&rowId!=="live")?takeById(rowId):null;
  const clip=e.target.closest(".clip");
  ptr={id:e.pointerId,x0:e.clientX,y0:e.clientY,lastX:e.clientX,kind:kind,row:row,rowId:rowId,t:t,clip:clip,
       mode:null,resume:S.playing,timer:0,pushed:false,moved:false,pan0:viewT0()};
  if(t&&clip&&kind==="lane") ptr.timer=setTimeout(startMove,HOLD_MS);
});
document.addEventListener("pointermove",e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){
    const [a,b]=[...pts.values()], r=$("ruler").getBoundingClientRect();
    const dist=Math.max(8,Math.hypot(a.x-b.x,a.y-b.y)), frac=clamp(((a.x+b.x)/2-r.left)/r.width,0,1);
    const nv=pinch.vis0*pinch.d0/dist;
    setView(nv,pinch.at-nv*frac); layoutSoon();
    return;
  }
  const p=ptr; if(!p||e.pointerId!==p.id) return;
  const dx=e.clientX-p.x0, dy=e.clientY-p.y0;
  p.lastX=e.clientX;
  if(p.mode==="move"){
    if(!p.pushed){ if(Math.abs(dx)<3) return; pushUndo(); p.pushed=true; }
    p.moved=true;
    const off=p.off0+(dx/p.w)*p.vis;
    /* keep at least a sliver of the take on the timeline */
    p.t.offset=clamp(off,0.05-p.t.buffer.duration-p.t.nudge/1000,p.d-0.05-p.t.nudge/1000);
    placeClip(p.row,p.t);
    p.clip.dataset.t=fmt(Math.max(0,p.t.offset+p.t.nudge/1000));
    return;
  }
  if(!p.mode&&Math.hypot(dx,dy)>8){
    clearTimeout(p.timer); p.timer=0;
    if(Math.abs(dx)>Math.abs(dy)&&p.kind!=="lbl"){
      p.moved=true;
      try{ (p.kind==="ruler"?$("ruler"):p.row.querySelector(".lane")).setPointerCapture(p.id); }catch(err){}
      if(p.kind==="ruler"&&!V.fit) p.mode="pan";            /* zoomed in: the ruler pans the view */
      else{
        p.mode="scrub";
        if(S.playing){ stopSources(); cancelAnimationFrame(raf); S.playing=false; setPlayIcon(); }
        if(!edgeT) edgeT=requestAnimationFrame(edgeTick);
      }
    } else { ptr=null; return; }           /* a vertical swipe: let the page scroll */
  }
  if(p.mode==="pan"){
    const W=Math.max(1,$("ruler").clientWidth), vis=viewVis();
    setView(vis,p.pan0-(dx/W)*vis); layoutSoon();
  }
  else if(p.mode==="scrub") scrubSeek(e.clientX);
});
function endPtr(e,cancel){
  const had=pts.delete(e.pointerId);
  if(pinch&&pts.size<2){ endPinch(); if(ptr&&ptr.id===e.pointerId) ptr=null; return; }
  const p=ptr; if(!p||e.pointerId!==p.id) return;
  ptr=null; clearTimeout(p.timer);
  if(S.recording) return;
  if(p.mode==="move"){
    p.clip.classList.remove("grab","mv");
    if(p.moved){
      renderAll(); scheduleSave(); restartSoon();
      toast(p.t.name+" moved to "+fmt(Math.max(0,p.t.offset+p.t.nudge/1000))+". Undo puts it back.");
    }
    return;
  }
  if(p.mode==="pan") return;
  if(p.mode==="scrub"){
    if(!cancel) scrubSeek(e.clientX);
    if(p.resume) play(S.playhead);
    return;
  }
  if(cancel) return;
  /* a tap */
  if(p.kind==="ruler"){ scrubSeek(e.clientX); if(S.playing) play(S.playhead); return; }
  if(p.rowId==="beat") openSheet("beat");
  else if(p.t) openSheet("take",p.t.id);
}
document.addEventListener("pointerup",e=>endPtr(e,false));
document.addEventListener("pointercancel",e=>endPtr(e,true));
/* two fingers on the timeline are ours: no page zoom, no page scroll */
$("stage").addEventListener("touchmove",e=>{ if(e.touches&&e.touches.length>=2) e.preventDefault(); },{passive:false});
/* zoom buttons, desktop wheel / trackpad pinch, and the overview strip */
$("zoomIn").addEventListener("click",()=>zoomBy(1.7));
$("zoomOut").addEventListener("click",()=>zoomBy(1/1.7));
$("stage").addEventListener("wheel",e=>{
  if(!e.target.closest("#trackList, #ruler")) return;
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();
    const r=$("ruler").getBoundingClientRect();
    zoomBy(Math.exp(-e.deltaY*0.0045),clamp((e.clientX-r.left)/r.width,0,1));
  } else if(!V.fit&&Math.abs(e.deltaX)>Math.abs(e.deltaY)){
    e.preventDefault();
    const W=Math.max(1,$("ruler").clientWidth), vis=viewVis();
    setView(vis,viewT0()+(e.deltaX/W)*vis); layoutSoon();
  }
},{passive:false});
let miniDrag=false;
function miniSet(x){
  const r=$("mini").getBoundingClientRect(), d=tlDur(), vis=viewVis();
  setView(vis,clamp((x-r.left)/Math.max(1,r.width),0,1)*d-vis/2); layoutSoon();
}
$("mini").addEventListener("pointerdown",e=>{ miniDrag=true; try{ $("mini").setPointerCapture(e.pointerId); }catch(err){} miniSet(e.clientX); });
$("mini").addEventListener("pointermove",e=>{ if(miniDrag) miniSet(e.clientX); });
$("mini").addEventListener("pointerup",()=>{ miniDrag=false; });
$("mini").addEventListener("pointercancel",()=>{ miniDrag=false; });

let rz=0;
window.addEventListener("resize",()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{ renderBeat(); renderTracks(); renderHeads(); syncBarH(); layoutForSheet(); if(UI.sheet==="take"&&UI.tab==="edit") drawEdit(); },180);
});
document.addEventListener("keydown",e=>{
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key==="Escape"){ closeSheet(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
  if(e.code==="Space"){ e.preventDefault(); if(!S.recording){ S.playing?pause():playHere(); } }
});

/* ============================ boot ============================ */
(async function boot(){
  hydrateIcons();
  initRanges(document);
  loadLatency();
  loadAuto();
  syncBarH();
  try{ new ResizeObserver(()=>{ syncBarH(); layoutForSheet(); }).observe($("dock")); }catch(e){}
  probeSync();
  renderCheck();
  renderAll();
  setPlayIcon();

  renderSessions();
  DB.db=await idbOpen(); DB.ok=!!DB.db;
  setSaveState(DB.ok?"saved":"off");
  const restored=await loadSessions();
  renderSessions();
  if(restored){ renderAll(); toast("Picked your session back up where you left it."); }

  await probeAsync();
  renderCheck();
})();

})();
</script>
