}));
function bindTog(id,key,after){
  $(id).addEventListener("click",()=>{
    S[key]=!S[key]; setTog(id,S[key]);
    if(after) after();
    renderMix(); scheduleSave();
  });
}
bindTog("tgMonitor","monitor");
bindTog("tgCount","countIn");
bindTog("tgLoop","loop");
bindTog("tgStems","stems");

$("exportBtn").addEventListener("click",doExport);
$("stopBtn").addEventListener("click",()=>{ if(S.recording) stopRec(); else stopAll(); });
$("playBtn").addEventListener("click",()=>{ if(S.recording) return; S.playing?pause():play(S.playhead); });
$("recBtn").addEventListener("click",()=>{ S.recording?stopRec():startRec(); });
/* Finger scrubbing on the transport bar and on every lane — beat and
   takes. A tap jumps there; a sideways drag scrubs, pausing the sound
   while the finger moves and picking playback back up on release.
   Vertical swipes are left to the browser so the page still scrolls. */
let scrubSt=null;
/* Drag the red clip itself to slide a take along the timeline. Dragging
   anywhere else on a lane scrubs. One undo step per drag. */
function placeClip(row,t){
  const clip=row&&row.querySelector(".clip"); if(!clip) return;
  const d=duration(), raw=t.offset+t.nudge/1000, start=Math.max(0,raw);
  const left=(start/d)*100;
  clip.style.left=left.toFixed(3)+"%";
  clip.style.width=Math.max(0.6,Math.min(100-left,((t.buffer.duration-(start-raw))/d)*100)).toFixed(3)+"%";
}
function scrubSeek(st,x){
  const r=st.el.getBoundingClientRect();
  S.playhead=clamp((x-r.left)/Math.max(1,r.width),0,1)*duration();
  renderHeads();
}
document.addEventListener("pointerdown",e=>{
  if(S.recording||(e.pointerType==="mouse"&&e.button!==0)) return;
  if(e.target.closest("button,input")) return;
  const el=e.target.closest("#scrub,#beatLane,[data-lane]"); if(!el) return;
  const clip=e.target.closest(".clip"), row=el.closest(".take");
  const t=clip&&row?S.takes.find(x=>x.id==row.dataset.id):null;
  scrubSt={el:el,id:e.pointerId,x0:e.clientX,drag:false,resume:S.playing,
           move:t?{t:t,row:row,clip:clip,off0:t.offset,d:duration()}:null};
});
document.addEventListener("pointermove",e=>{
  const st=scrubSt; if(!st||e.pointerId!==st.id) return;
  if(!st.drag){
    if(Math.abs(e.clientX-st.x0)<6) return;
    st.drag=true;
    try{ st.el.setPointerCapture(st.id); }catch(err){}
    if(st.move){ pushUndo(); st.move.clip.classList.add("grab"); }
    else if(S.playing){ stopSources(); cancelAnimationFrame(raf); S.playing=false; setPlayIcon(); }
  }
  if(st.move){
    const m=st.move, w=Math.max(1,st.el.getBoundingClientRect().width);
    const off=m.off0+((e.clientX-st.x0)/w)*m.d;
    /* keep at least a sliver of the take on the timeline */
    m.t.offset=clamp(off,0.05-m.t.buffer.duration-m.t.nudge/1000,m.d-0.05-m.t.nudge/1000);
    placeClip(m.row,m.t);
    return;
  }
  scrubSeek(st,e.clientX);
});
document.addEventListener("pointerup",e=>{
  const st=scrubSt; if(!st||e.pointerId!==st.id) return;
  scrubSt=null;
  if(S.recording) return;
  if(st.move&&st.drag){
    renderAll(); scheduleSave(); restartSoon();
    toast(st.move.t.name+" moved to "+fmt(Math.max(0,st.move.t.offset+st.move.t.nudge/1000))+". Undo puts it back.");
    return;
  }
  scrubSeek(st,e.clientX);
  if(st.resume) play(S.playhead);
});
document.addEventListener("pointercancel",e=>{
  const st=scrubSt; if(!st||e.pointerId!==st.id) return;
  scrubSt=null;
  if(st.move&&st.drag){ renderAll(); scheduleSave(); restartSoon(); return; }
  if(st.drag&&st.resume&&!S.recording) play(S.playhead);
});
$("recheck").addEventListener("click",async()=>{
  probeSync(); await probeAsync(); renderCheck();
  toast("Signal check re-run.");
});

let rz=0;
window.addEventListener("resize",()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{ renderBeat(); renderTakes(); renderHeads(); syncBarH(); },180);
});
document.addEventListener("keydown",e=>{
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); return; }
  if(e.code==="Space"){ e.preventDefault(); if(!S.recording){ S.playing?pause():play(S.playhead); } }
});

/* ============================ boot ============================ */
(async function boot(){
  loadLatency();
  loadAuto();
  syncBarH();
  probeSync();
  renderCheck();
  renderAll();
  setPlayIcon();

  renderSessions();
  DB.db=await idbOpen(); DB.ok=!!DB.db;
  const restored=await loadSessions();
  renderSessions();
  if(restored){ renderAll(); toast("Picked your session back up where you left it."); }

  await probeAsync();
  renderCheck();
})();













})();
</script>
